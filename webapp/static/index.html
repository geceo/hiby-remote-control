<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HiBy Remote</title>
<meta name="theme-color" content="#d5dadd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a232a" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Anodized-aluminium faceplate, slate ink, amber signal light. */
:root {
  --plate: #d5dadd;        /* aluminium body */
  --plate-hi: #e9ecee;     /* raised panel */
  --plate-lo: #c3c9cd;     /* recessed groove */
  --ink: #1d2a33;          /* slate text */
  --ink-soft: #55646e;
  --signal: #d98a1c;       /* amber status light */
  --signal-ink: #2a1a04;
  --danger: #b2412f;
  --focus: #2f6fb0;
  --radius-knob: 999px;
  --radius-panel: 14px;
  --radius-row: 8px;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --plate: #1a232a; --plate-hi: #232f37; --plate-lo: #141b20;
    --ink: #e4e9ec; --ink-soft: #93a2ac;
    --signal: #f0a53a; --signal-ink: #241503; --danger: #e0705c; --focus: #79b2ea;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--plate);
  color: var(--ink);
  font: 400 16px/1.45 var(--body);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar */
.bar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--plate-lo);
}
.brand { font: 600 20px/1 var(--display); letter-spacing: .02em; margin-right: auto; }
.lamp {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--plate-lo); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
}
.lamp.on { background: var(--signal); box-shadow: 0 0 8px var(--signal); }
.lamp.busy { background: var(--signal); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.devname { font-weight: 500; }
.linkbtn { background: none; border: 0; padding: 4px 6px; color: var(--ink-soft); text-decoration: underline; }

/* ---------- layout */
main {
  display: grid; gap: 24px;
  grid-template-columns: minmax(300px, 400px) 1fr;
  padding: 24px 20px 40px; max-width: 1200px; margin: 0 auto;
}
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; padding: 16px 16px 110px; gap: 20px; }
}

/* ---------- now playing */
.deck { position: sticky; top: 16px; align-self: start; }
@media (max-width: 820px) { .deck { position: static; } }
.cover {
  width: 100%; aspect-ratio: 1; border-radius: var(--radius-panel);
  background: var(--plate-lo) center/cover no-repeat;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  display: grid; place-items: center; color: var(--ink-soft);
}
@media (max-width: 820px) { .cover { width: min(100%, 360px); margin: 0 auto; } }
.title {
  font: 700 clamp(30px, 4.2vw, 42px)/1.02 var(--display);
  margin: 20px 0 4px; letter-spacing: -.005em;
  overflow-wrap: anywhere;
}
.sub { color: var(--ink-soft); margin: 0; overflow-wrap: anywhere; }
.readout {
  display: inline-flex; gap: 10px; margin-top: 12px;
  font: 600 15px/1 var(--display); letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
  padding: 6px 10px; border-radius: 6px;
  background: var(--ink); color: var(--plate-hi);
}
.readout:empty { display: none; }
.readout b { color: var(--signal); font-weight: 600; }

.scrub { margin-top: 22px; }
.scrub input { width: 100%; }
.times {
  display: flex; justify-content: space-between;
  font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 14px;
}

input[type=range] {
  -webkit-appearance: none; appearance: none; height: 22px; background: transparent;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(to right, var(--signal) var(--fill, 0%), var(--plate-lo) var(--fill, 0%));
}
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--plate-lo); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--signal); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px;
  border-radius: 50%; background: var(--plate-hi); border: 2px solid var(--ink);
}
input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%; background: var(--plate-hi); border: 2px solid var(--ink);
}

.transport { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
.key {
  width: 52px; height: 52px; border-radius: var(--radius-knob);
  border: 1px solid var(--plate-lo); background: var(--plate-hi);
  display: grid; place-items: center;
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 2px 0 var(--plate-lo);
}
.key:active { transform: translateY(1px); box-shadow: none; }
.key svg { width: 22px; height: 22px; fill: currentColor; }
.key.main { width: 68px; height: 68px; background: var(--ink); color: var(--plate-hi); border-color: var(--ink); }
.key.main svg { width: 28px; height: 28px; }
.key[aria-pressed=true] { color: var(--signal); }
.key:disabled { opacity: .4; cursor: default; }

.vol { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
.vol input { flex: 1; }
.vol svg { width: 20px; height: 20px; fill: var(--ink-soft); flex: none; }
.vol output { width: 3ch; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.modeinfo { text-align: center; color: var(--ink-soft); font-size: 14px; margin-top: 6px; min-height: 1.4em; }

/* ---------- connection */
.connect {
  background: var(--plate-hi); border-radius: var(--radius-panel);
  padding: 20px; margin-bottom: 20px;
}
.connect h2 { font: 600 24px/1.1 var(--display); margin: 0 0 6px; }
.connect p { margin: 0 0 14px; color: var(--ink-soft); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.field {
  flex: 1; min-width: 160px; padding: 10px 12px; border-radius: var(--radius-row);
  border: 1px solid var(--plate-lo); background: var(--plate);
}
.btn {
  padding: 10px 18px; border-radius: var(--radius-row); border: 0;
  background: var(--ink); color: var(--plate-hi); font-weight: 600;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--plate-lo); }
.found { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; }
.found button {
  width: 100%; text-align: left; padding: 10px 12px; border-radius: var(--radius-row);
  border: 1px solid var(--plate-lo); background: var(--plate);
  display: flex; justify-content: space-between; gap: 8px;
}
.found small { color: var(--ink-soft); }
.err { color: var(--danger); margin-top: 10px; }
.err:empty { display: none; }

/* ---------- library */
.lib { min-width: 0; }
.tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 2px; margin-bottom: 14px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 0; background: transparent; padding: 8px 12px;
  border-radius: var(--radius-row); color: var(--ink-soft); font-weight: 500;
}
.tab[aria-selected=true] { background: var(--ink); color: var(--plate-hi); }
.search { display: flex; gap: 8px; margin-bottom: 14px; }
.search select { padding: 0 8px; border-radius: var(--radius-row); border: 1px solid var(--plate-lo); background: var(--plate-hi); }

.crumbs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-bottom: 6px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--ink-soft); text-decoration: underline; }
.crumbs span { color: var(--ink-soft); }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.head h1 { font: 700 30px/1.05 var(--display); margin: 0; overflow-wrap: anywhere; }
.head .count { color: var(--ink-soft); font-size: 14px; }
.actions { display: flex; gap: 8px; flex: none; }

.list { list-style: none; margin: 0; padding: 0; background: var(--plate-hi); border-radius: var(--radius-panel); overflow: hidden; }
.item {
  display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; gap: 10px;
  width: 100%; padding: 10px 14px; border: 0; background: transparent; text-align: left;
  border-top: 1px solid var(--plate-lo);
}
.list li:first-child .item { border-top: 0; }
.item:hover { background: color-mix(in srgb, var(--plate-lo) 45%, transparent); }
.item .n { color: var(--ink-soft); font-variant-numeric: tabular-nums; font-size: 14px; text-align: right; }
.item .t { min-width: 0; }
.item .t strong { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .t small { display: block; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .q { font: 600 13px/1 var(--display); letter-spacing: .04em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.item.playing strong { color: var(--signal); }
.item.playing .n { color: var(--signal); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-soft); }
.more { display: block; margin: 14px auto 0; }

/* ---------- mobile mini player */
.mini {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: var(--ink); color: var(--plate-hi);
  align-items: center; gap: 12px;
}
.mini .mt { flex: 1; min-width: 0; }
.mini strong, .mini small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini small { opacity: .7; }
.mini button { background: none; border: 0; color: inherit; width: 40px; height: 40px; display: grid; place-items: center; }
.mini svg { width: 24px; height: 24px; fill: currentColor; }
@media (max-width: 820px) { body.linked .mini { display: flex; } }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--ink); color: var(--plate-hi); padding: 10px 16px; border-radius: var(--radius-row);
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; }
@media (max-width: 820px) { .toast { bottom: 90px; } }
@media (prefers-reduced-motion: reduce) { .lamp.busy { animation: none; } .toast { transition: none; } }
[hidden] { display: none !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M5 5h2.5v14H5zM20 5v14L8.5 12z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M16.5 5H19v14h-2.5zM4 5v14l11.5-7z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></symbol>
  <symbol id="i-order" viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-1V7h2v8h2.5L19 19.5 15.5 15z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></symbol>
  <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2zm-4-2V9h-1l-2 1v1h1.5v4z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></symbol>
</svg>

<header class="bar">
  <span class="brand">HiBy Remote</span>
  <span class="lamp" id="lamp" aria-hidden="true"></span>
  <span class="devname" id="devname">Not connected</span>
  <button class="linkbtn" id="btn-disconnect" hidden>Disconnect</button>
</header>

<main>
  <section class="deck" aria-label="Now playing">
    <div class="cover" id="cover" role="img" aria-label="Album cover"></div>
    <h2 class="title" id="np-title">Nothing playing</h2>
    <p class="sub" id="np-artist"></p>
    <p class="sub" id="np-album"></p>
    <div class="readout" id="np-readout"></div>

    <div class="scrub">
      <label class="sr" for="seek">Position</label>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1">
      <div class="times"><span id="t-pos">0:00</span><span id="t-dur">0:00</span></div>
    </div>

    <div class="transport">
      <button class="key" id="btn-mode" aria-label="Play mode"><svg><use href="#i-order"/></svg></button>
      <button class="key" id="btn-prev" aria-label="Previous track"><svg><use href="#i-prev"/></svg></button>
      <button class="key main" id="btn-play" aria-label="Play"><svg><use href="#i-play"/></svg></button>
      <button class="key" id="btn-next" aria-label="Next track"><svg><use href="#i-next"/></svg></button>
      <button class="key" id="btn-stop" aria-label="Stop"><svg><use href="#i-stop"/></svg></button>
    </div>
    <div class="modeinfo" id="modeinfo"></div>

    <div class="vol">
      <svg aria-hidden="true"><use href="#i-vol"/></svg>
      <label class="sr" for="vol">Volume</label>
      <input type="range" id="vol" min="0" max="100" value="0">
      <output id="vol-out" for="vol">–</output>
    </div>
  </section>

  <section class="lib" aria-label="Library">
    <div class="connect" id="connect">
      <h2>Connect to your player</h2>
      <p>On the player, turn on HiByLink in its settings, then pick it below or type its IP address.</p>
      <form class="row" id="connect-form">
        <label class="sr" for="host">Player address</label>
        <input class="field" id="host" placeholder="192.168.1.42" autocomplete="off" inputmode="url">
        <button class="btn" type="submit">Connect</button>
      </form>
      <ul class="found" id="found"></ul>
      <p class="sub" id="scan-hint"></p>
      <div class="err" id="conn-err"></div>
    </div>

    <div id="browser" hidden>
      <div class="tabs" role="tablist" id="tabs"></div>
      <form class="search" id="search-form" hidden>
        <label class="sr" for="q">Search</label>
        <input class="field" id="q" placeholder="Title, album, artist…" autocomplete="off">
        <label class="sr" for="qkind">Search in</label>
        <select id="qkind">
          <option value="songs">Songs</option><option value="albums">Albums</option>
          <option value="artists">Artists</option><option value="genres">Genres</option>
        </select>
        <button class="btn" type="submit">Search</button>
      </form>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="head">
        <div><h1 id="view-title"></h1><span class="count" id="view-count"></span></div>
        <div class="actions" id="view-actions"></div>
      </div>
      <ul class="list" id="list"></ul>
      <button class="btn ghost more" id="more" hidden>Load more</button>
    </div>
  </section>
</main>

<div class="mini" id="mini">
  <div class="mt"><strong id="mini-title">Nothing playing</strong><small id="mini-artist"></small></div>
  <button id="mini-prev" aria-label="Previous track"><svg><use href="#i-prev"/></svg></button>
  <button id="mini-play" aria-label="Play"><svg><use href="#i-play"/></svg></button>
  <button id="mini-next" aria-label="Next track"><svg><use href="#i-next"/></svg></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const PAGE = 60;
const MODES = { 1: ["In order", "i-order"], 2: ["Repeat all", "i-repeat"], 3: ["Repeat one", "i-repeat1"], 4: ["Shuffle", "i-shuffle"] };
const TABS = [
  ["Albums", "1#0@[05]"], ["Artists", "1#0@[03]"], ["Playlists", "1#0@[02]"],
  ["Songs", "1#1@[01]"], ["Genres", "1#0@[04]"], ["Favourites", "1#1@[08]"],
  ["Recent", "1#1@[09]"], ["Queue", "1#1@[00]"], ["Folders", "2#0@[06]\\"], ["Search", null],
];

let S = {};                  // last state from the server
let posBase = 0, posAt = 0;  // progress interpolation (ms, local clock)
let dragging = false;
let stack = [];              // library navigation stack: {uri, title, items, size}
let activeTab = 0;

// ---------------------------------------------------------------- API
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function control(cmd, value) {
  return api("/api/control", { cmd, value }).catch((e) => toast(e.message));
}
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}

// ---------------------------------------------------------------- formatting
function fmtTime(ms) {
  if (!(ms >= 0)) return "0:00";
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
function fmtRate(hz) {
  if (!hz) return "";
  const k = hz / 1000;
  return (Number.isInteger(k) ? k : k.toFixed(1)) + " kHz";
}
function durationMs(meta) {
  // Duration and progress are both in milliseconds (docs/APK_ANALYSIS.md).
  return (meta && meta.duration) || 0;
}
function ext(path) {
  const m = /\.([a-z0-9]+)$/i.exec(path || "");
  return m ? m[1].toUpperCase() : "";
}

// ---------------------------------------------------------------- state rendering
function render(s) {
  const prev = S; S = s;
  const linked = !!s.connected;
  document.body.classList.toggle("linked", linked);
  $("lamp").className = "lamp" + (linked ? " on" : s.connecting ? " busy" : "");
  const d = s.device || {};
  $("devname").textContent = linked ? ([d.manufacturer, d.model].filter(Boolean).join(" ") || s.host)
    : s.connecting ? `Connecting to ${s.host}…` : "Not connected";
  $("btn-disconnect").hidden = !(linked || s.connecting);
  $("connect").hidden = linked;
  $("browser").hidden = !linked;
  $("conn-err").textContent = !linked && s.error ? errorText(s.error) : "";
  if (s.host && !$("host").value) $("host").value = s.host;
  if (linked && !prev.connected) openTab(activeTab);

  const m = s.meta || {};
  $("np-title").textContent = m.title || (linked ? "Nothing playing" : "Not connected");
  $("np-artist").textContent = m.artist || "";
  $("np-album").textContent = [m.album, m.year].filter(Boolean).join(", ");
  const readout = [];
  const fmt = ext(m.path);
  if (fmt) readout.push(`<b>${fmt}</b>`);
  if (m.sample_bits) readout.push(`${m.sample_bits}-bit`);
  if (m.sample_rate) readout.push(fmtRate(m.sample_rate));
  if (m.bitrate) readout.push(`${m.bitrate} kbps`);
  $("np-readout").innerHTML = readout.join("<span aria-hidden=true>/</span>");
  $("mini-title").textContent = m.title || "Nothing playing";
  $("mini-artist").textContent = m.artist || "";

  const playing = s.play_state === 1;
  for (const id of ["btn-play", "mini-play"]) {
    const b = $(id);
    b.querySelector("use").setAttribute("href", playing ? "#i-pause" : "#i-play");
    b.setAttribute("aria-label", playing ? "Pause" : "Play");
  }
  const mode = MODES[s.play_mode] || MODES[1];
  $("btn-mode").querySelector("use").setAttribute("href", "#" + mode[1]);
  $("btn-mode").setAttribute("aria-label", `Play mode: ${mode[0]}`);
  $("modeinfo").textContent = s.play_mode ? mode[0] : "";

  const max = d.max_volume || 100;
  const v = $("vol");
  v.max = max;
  if (s.volume != null && document.activeElement !== v) { v.value = s.volume; setFill(v); $("vol-out").textContent = s.volume; }

  if (s.progress != null && (s.progress !== prev.progress || s.progress_at !== prev.progress_at)) {
    posBase = s.progress; posAt = performance.now();
  }
  if (s.cover_version !== prev.cover_version || s.connected !== prev.connected) {
    $("cover").style.backgroundImage = s.cover_version && linked ? `url(/api/cover?v=${s.cover_version})` : "";
  }
  for (const k of ["btn-prev", "btn-play", "btn-next", "btn-stop", "btn-mode"]) $(k).disabled = !linked;
  v.disabled = $("seek").disabled = !linked;
  if (s.uuid !== prev.uuid) markPlaying();
  tick();
}
function errorText(e) {
  if (/refused/i.test(e)) return `${e}. Check that HiByLink is turned on in the player's settings.`;
  if (/timed out|unreachable|no route/i.test(e)) return `${e}. Check the address and that the player is on the same network.`;
  return e;
}
function setFill(r) { r.style.setProperty("--fill", (r.max > 0 ? (r.value / r.max) * 100 : 0) + "%"); }

function tick() {
  const dur = durationMs(S.meta);
  let pos = posBase + (S.play_state === 1 && posAt ? performance.now() - posAt : 0);
  if (dur) pos = Math.min(pos, dur);
  const seek = $("seek");
  if (!dragging) {
    seek.max = dur || 1000;
    seek.value = dur ? pos : 0;
    setFill(seek);
    $("t-pos").textContent = fmtTime(pos);
  }
  $("t-dur").textContent = fmtTime(dur);
}
setInterval(tick, 250);

// ---------------------------------------------------------------- events
function listen() {
  const es = new EventSource("/api/events");
  es.addEventListener("state", (e) => render(JSON.parse(e.data)));
  es.onerror = () => { $("lamp").className = "lamp"; };
}

$("btn-play").onclick = $("mini-play").onclick = () => control("toggle");
$("btn-prev").onclick = $("mini-prev").onclick = () => control("prev");
$("btn-next").onclick = $("mini-next").onclick = () => control("next");
$("btn-stop").onclick = () => control("stop");
$("btn-mode").onclick = () => control("mode", ((S.play_mode || 1) % 4) + 1);
$("btn-disconnect").onclick = () => api("/api/disconnect", {}).catch((e) => toast(e.message));

const seek = $("seek");
seek.addEventListener("input", () => { dragging = true; setFill(seek); $("t-pos").textContent = fmtTime(+seek.value); });
seek.addEventListener("change", () => {
  dragging = false;
  if (!durationMs(S.meta)) return;
  posBase = +seek.value; posAt = performance.now();
  control("seek", Math.round(+seek.value));
});

let volTimer;
$("vol").addEventListener("input", (e) => {
  const v = e.target; setFill(v); $("vol-out").textContent = v.value;
  clearTimeout(volTimer); volTimer = setTimeout(() => control("volume", +v.value), 150);
});

$("connect-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const host = $("host").value.trim();
  if (host) connectTo(host);
});
function connectTo(host) {
  $("conn-err").textContent = "";
  api("/api/connect", { host }).catch(() => { /* error shown from state */ });
}

async function scan() {
  if (S.connected) return;
  try {
    const { devices, errors } = await api("/api/devices");
    const ul = $("found"); ul.replaceChildren();
    for (const d of devices) {
      const li = document.createElement("li"), b = document.createElement("button");
      b.innerHTML = `<span></span><small></small>`;
      b.firstChild.textContent = d.name; b.lastChild.textContent = d.host;
      b.onclick = () => { $("host").value = d.host; connectTo(d.host); };
      li.append(b); ul.append(li);
    }
    $("scan-hint").textContent = devices.length ? "" :
      errors.length ? "Automatic discovery is unavailable here; type the player's address."
                    : "Looking for players on your network…";
  } catch { /* server unreachable: EventSource will retry */ }
}
setInterval(scan, 4000);

// ---------------------------------------------------------------- library
function buildTabs() {
  const t = $("tabs");
  TABS.forEach(([name], i) => {
    const b = document.createElement("button");
    b.className = "tab"; b.role = "tab"; b.textContent = name;
    b.onclick = () => openTab(i);
    t.append(b);
  });
}
function openTab(i) {
  activeTab = i;
  [...$("tabs").children].forEach((b, j) => b.setAttribute("aria-selected", i === j));
  const [name, uri] = TABS[i];
  $("search-form").hidden = uri !== null;
  stack = [];
  if (uri === null) {
    showEmpty("Search", "Type a title, album or artist name.");
    $("q").focus();
    return;
  }
  push(uri, name);
}

function showEmpty(title, msg) {
  $("crumbs").replaceChildren();
  $("view-title").textContent = title; $("view-count").textContent = "";
  $("view-actions").replaceChildren();
  $("list").innerHTML = `<li class="empty"></li>`; $("list").firstChild.textContent = msg;
  $("more").hidden = true;
}

$("search-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  const kind = $("qkind").value;
  const uri = kind === "songs" ? `3#1@[07]${q}@[01]` : `3#0@[07]${q}${{ albums: "@[05]", artists: "@[03]", genres: "@[04]" }[kind]}`;
  stack = [];
  push(uri, `“${q}”`);
});

function push(uri, title) {
  stack.push({ uri, title, items: [], size: null });
  load(true);
}
function pop(n) { stack.length = n + 1; load(true); }

async function load(fresh) {
  const v = stack[stack.length - 1];
  if (fresh) { v.items = []; v.size = null; renderView(true); }
  const qs = new URLSearchParams({ uri: v.uri, start: v.items.length, count: PAGE });
  if (v.size != null) qs.set("size", v.size);
  $("more").disabled = true;
  try {
    const r = await api("/api/list?" + qs);
    if (stack[stack.length - 1] !== v) return;  // user navigated away
    v.size = r.size; v.kind = r.kind; v.items.push(...r.items);
    renderView(false);
  } catch (e) {
    if (stack[stack.length - 1] === v) { $("list").innerHTML = `<li class="empty"></li>`; $("list").firstChild.textContent = e.message; }
  } finally { $("more").disabled = false; }
}

const isFiles = (uri) => uri.slice(3, 8) === "@[06]";
const isAudioFile = (it) => it.data === 80 || it.data === 81;

function childUri(uri, it) {
  if (isFiles(uri)) return "2#0@[06]" + (uri === "2#0@[06]\\" ? it.name : it.uuid);
  const search = /^3#0@\[07\].*@\[(\d\d)\]$/.exec(uri);
  if (search) return { "05": "2#1@[05]", "03": "3#0@[03]", "04": "3#0@[04]" }[search[1]] + it.name + (search[1] === "05" ? "" : "@[05]");
  if (uri === "1#0@[03]" || uri === "1#0@[04]") return `3#0@[${uri.slice(5, 7)}]${it.name}@[05]`;
  return `${+uri[0] + 1}#1${uri.slice(3)}${it.name}`;
}

function renderView(loading) {
  const v = stack[stack.length - 1];
  const cr = $("crumbs"); cr.replaceChildren();
  stack.slice(0, -1).forEach((s, i) => {
    const b = document.createElement("button"); b.textContent = s.title; b.onclick = () => pop(i);
    const sep = document.createElement("span"); sep.textContent = "/"; sep.setAttribute("aria-hidden", "true");
    cr.append(b, sep);
  });
  $("view-title").textContent = v.title;
  $("view-count").textContent = v.size == null ? "" : `${v.size} ${v.kind === "songs" ? (v.size === 1 ? "song" : "songs") : (v.size === 1 ? "item" : "items")}`;

  const acts = $("view-actions"); acts.replaceChildren();
  if (v.kind === "songs" && v.size > 0) acts.append(button("Play all", () => play({ uri: v.uri, index: 0 })));
  const artistAlbums = /^3#0@\[(03|04)\](.*)@\[05\]$/.exec(v.uri);
  if (artistAlbums) acts.append(button("All songs", () => push(`2#1@[${artistAlbums[1]}]${artistAlbums[2]}`, "All songs"), true));

  const ul = $("list"); ul.replaceChildren();
  if (loading) { ul.innerHTML = `<li class="empty">Loading…</li>`; $("more").hidden = true; return; }
  if (!v.items.length) { ul.innerHTML = `<li class="empty">This list is empty.</li>`; }
  v.items.forEach((it, i) => ul.append(row(v, it, i)));
  $("more").hidden = !(v.size > v.items.length);
  $("more").textContent = `Load more (${v.size - v.items.length} left)`;
  markPlaying();
}
$("more").onclick = () => load(false);

function button(label, fn, ghost) {
  const b = document.createElement("button");
  b.className = "btn" + (ghost ? " ghost" : ""); b.textContent = label; b.onclick = fn;
  return b;
}

function row(v, it, i) {
  const li = document.createElement("li"), b = document.createElement("button");
  b.className = "item";
  b.innerHTML = `<span class="n"></span><span class="t"><strong></strong><small></small></span><span class="q"></span>`;
  const [n, t, q] = b.children;
  t.firstChild.textContent = it.name || "(untitled)";
  if (v.kind === "songs") {
    n.textContent = i + 1;
    t.lastChild.textContent = it.artist || "";
    q.textContent = [it.sample_bits && `${it.sample_bits}/`, it.sample_rate && fmtRate(it.sample_rate).replace(" kHz", "")].filter(Boolean).join("");
    b.dataset.uuid = it.uuid;
    b.onclick = () => play({ uri: v.uri, uuid: it.uuid });
  } else if (isFiles(v.uri) && v.uri !== "2#0@[06]\\" && isAudioFile(it)) {
    n.textContent = "♪";
    t.lastChild.textContent = ext(it.uuid);
    b.dataset.uuid = it.uuid;
    const dir = v.uri.slice(8);
    if (/\.(cue|iso)$/i.test(it.uuid)) {
      b.onclick = () => openTracks(dir, it);
    } else {
      b.onclick = () => play({ uri: v.uri, uuid: it.uuid });
    }
  } else {
    n.textContent = isFiles(v.uri) ? "▸" : "";
    if (v.uri === "2#0@[06]\\") {
      const [tot, free] = String(it.uuid).split("-");
      t.lastChild.textContent = tot && free ? `${free} GB free of ${tot} GB` : "";
    } else if (!isFiles(v.uri) && it.data) {
      t.lastChild.textContent = `${it.data} ${it.data === 1 ? "song" : "songs"}`;
    }
    b.onclick = () => push(childUri(v.uri, it), it.name);
  }
  li.append(b);
  return li;
}

async function openTracks(dir, it) {
  try {
    const { tracks } = await api(`/api/tracks?${new URLSearchParams({ dir, file: it.uuid })}`);
    if (!Array.isArray(tracks) || !tracks.length) return play({ uri: "2#0@[06]" + dir, uuid: it.uuid });
    stack.push({ uri: "cue:" + it.uuid, title: it.name, items: [], size: tracks.length, kind: "tracks" });
    renderView(false);
    $("view-count").textContent = `${tracks.length} tracks`;
    $("more").hidden = true;
    const ul = $("list"); ul.replaceChildren();
    tracks.forEach((tr) => {
      const li = document.createElement("li"), b = document.createElement("button");
      b.className = "item";
      b.innerHTML = `<span class="n"></span><span class="t"><strong></strong></span><span></span>`;
      b.children[0].textContent = tr.number; b.children[1].firstChild.textContent = tr.name;
      b.onclick = () => play({ dir, file: it.uuid, track: tr.uuid });
      li.append(b); ul.append(li);
    });
  } catch (e) { toast(e.message); }
}

async function play(body) {
  try {
    const r = await api("/api/play", body);
    if (!r.ok) toast(`The player refused to start playback (code ${r.code}).`);
  } catch (e) { toast(e.message); }
}

function markPlaying() {
  for (const b of document.querySelectorAll(".item[data-uuid]")) b.classList.toggle("playing", !!S.uuid && b.dataset.uuid === S.uuid);
}

buildTabs();
listen();
scan();
</script>
</body>
</html>
